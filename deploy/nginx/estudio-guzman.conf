limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
server {
  listen 443 ssl http2;
  server_name api.example.com;
  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  client_max_body_size 52m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location /api/v1/auth/login { limit_req zone=api_login burst=5 nodelay; proxy_pass http://127.0.0.1:3001; include proxy_params; }
  location / { proxy_pass http://127.0.0.1:3001; include proxy_params; proxy_request_buffering off; proxy_read_timeout 120s; }
}

openapi: 3.1.0
info:
  title: Estudio Guzmán API
  version: 1.0.0
  description: API REST privada. Las mutaciones autenticadas requieren cookie, Origin permitido y x-csrf-token.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health/live:
    get: { security: [], responses: { '200': { description: Proceso vivo } } }
  /health/ready:
    get: { security: [], responses: { '200': { description: PostgreSQL y storage disponibles }, '503': { $ref: '#/components/responses/Problem' } } }
  /health/worker:
    get: { security: [], responses: { '200': { description: Worker saludable }, '503': { $ref: '#/components/responses/Problem' } } }
  /auth/login:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } } } } }
      responses: { '200': { description: Sesión iniciada }, '401': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' } }
  /auth/logout:
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '204': { description: Sesión revocada }, '403': { $ref: '#/components/responses/Problem' } } }
  /auth/me:
    get: { responses: { '200': { description: Usuario, versión y permisos efectivos }, '401': { $ref: '#/components/responses/Problem' } } }
    patch:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                email: { type: string, format: email, maxLength: 320 }
                name: { type: string, minLength: 2, maxLength: 160 }
                avatarUrl: { type: [string, 'null'], format: uri, maxLength: 2000 }
      responses: { '200': { description: Perfil propio actualizado }, '409': { $ref: '#/components/responses/Problem' } }
  /auth/change-password:
    post:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true, maxLength: 200 }
                newPassword: { type: string, writeOnly: true, minLength: 8, maxLength: 200 }
      responses: { '204': { description: Contraseña actualizada y sesiones revocadas }, '400': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' } }
  /dashboard:
    get:
      summary: Dashboard operativo
      description: >-
        Devuelve KPIs autorizados, tareas personales y los últimos 10 movimientos relevantes.
        Las acciones AUTH_* y USER_* se excluyen antes de ordenar y limitar. Con audit.read la
        actividad abarca todo el equipo; sin ese permiso se limita al usuario autenticado.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Día inicial inclusivo }
        - { name: to, in: query, schema: { type: string, format: date }, description: Día final inclusivo }
      responses:
        '200':
          description: KPIs autorizados, tareas y actividad relevante resumida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '403': { $ref: '#/components/responses/Problem' }
  /search:
    get:
      parameters: [ { name: q, in: query, schema: { type: string, maxLength: 100 } }, { name: types, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, maximum: 50 } } ]
      responses: { '200': { description: Resultados autorizados } }
  /team/metrics:
    get: { responses: { '200': { description: Métricas por integrante }, '403': { $ref: '#/components/responses/Problem' } } }
  /contacts:
    get: { responses: { '200': { description: Contactos paginados } } }
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '201': { description: Contacto creado }, '400': { $ref: '#/components/responses/Problem' } } }
  /users:
    get: { responses: { '200': { description: Usuarios autorizados } } }
    post:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, roleId, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                name: { type: string, minLength: 2, maxLength: 160 }
                roleId: { type: string, format: uuid }
                password: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
      responses: { '201': { description: Usuario creado con contraseña inicial hasheada }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /users/{userId}:
    parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get: { responses: { '200': { description: Usuario autorizado }, '404': { $ref: '#/components/responses/Problem' } } }
    patch:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                email: { type: string, format: email, maxLength: 320 }
                name: { type: string, minLength: 2, maxLength: 160 }
                avatarUrl: { type: [string, 'null'], format: uri, maxLength: 2000 }
                roleId: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
                password: { type: string, writeOnly: true, minLength: 8, maxLength: 200 }
      responses: { '200': { description: Usuario actualizado; los cambios sensibles revocan sus sesiones }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /cases:
    get: { responses: { '200': { description: Expedientes paginados } } }
    post:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courtName: { type: [string, 'null'], maxLength: 240 }
                managementOfficeName: { type: [string, 'null'], maxLength: 240 }
      responses: { '201': { description: Expediente creado } }
  /cases/{caseId}:
    parameters: [ { $ref: '#/components/parameters/CaseId' } ]
    get: { responses: { '200': { description: Expediente completo }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '200': { description: Expediente actualizado }, '409': { $ref: '#/components/responses/Problem' } } }
  /tasks:
    get: { responses: { '200': { description: Tareas filtradas y paginadas } } }
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '201': { description: Tarea creada } } }
  /tasks/{taskId}/status-transitions:
    post:
      parameters: [ { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Csrf' } ]
      responses: { '200': { description: Estado actualizado }, '409': { $ref: '#/components/responses/Problem' } }
  /notes:
    get: { responses: { '200': { description: Notas por contexto } } }
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '201': { description: Nota creada } } }
  /documents:
    get: { responses: { '200': { description: Metadata de documentos } } }
    post:
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [title, file], properties: { title: { type: string }, file: { type: string, format: binary } } } } } }
      responses: { '201': { description: PDF privado creado }, '413': { $ref: '#/components/responses/Problem' } }
  /notifications:
    get: { responses: { '200': { description: Bandeja propia y contador } } }
  /notifications/read-all:
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '204': { description: Bandeja leída } } }
  /notification-preferences:
    get: { responses: { '200': { description: Preferencias propias } } }
    patch: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '200': { description: Preferencias guardadas } } }
  /feedback:
    get: { responses: { '200': { description: Administración de sugerencias }, '403': { $ref: '#/components/responses/Problem' } } }
    post: { parameters: [ { $ref: '#/components/parameters/Csrf' } ], responses: { '201': { description: Sugerencia creada } } }
  /audit-logs:
    get:
      summary: Actividad completa
      description: >-
        Auditoría append-only para la página Actividad. Requiere audit.read y usa paginación por
        cursor descendente. from y to incluyen el día completo en UTC.
      parameters:
        - { name: entityType, in: query, schema: { type: string, minLength: 1, maxLength: 80 }, description: Tipo de entidad o módulo }
        - { name: entityId, in: query, schema: { type: string, format: uuid }, description: Entidad concreta; conservado por compatibilidad }
        - { name: actorId, in: query, schema: { type: string, format: uuid }, description: Usuario que realizó el movimiento }
        - { name: from, in: query, schema: { type: string, format: date }, description: Día inicial inclusivo }
        - { name: to, in: query, schema: { type: string, format: date }, description: Día final inclusivo }
        - { name: cursor, in: query, schema: { type: string, pattern: '^[0-9]+$' }, description: ID decimal de meta.nextCursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Auditoría paginada y filtrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: eg_session }
  parameters:
    Csrf: { name: x-csrf-token, in: header, required: true, schema: { type: string } }
    CaseId: { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance, requestId]
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, requestId: { type: string, format: uuid } }
    ActivityActor:
      type: object
      required: [id, name, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
    DashboardActivityEntry:
      type: object
      required: [id, action, entityType, entityId, actor, createdAt]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        actor:
          oneOf:
            - { $ref: '#/components/schemas/ActivityActor' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [range, kpis, myTasks, activity]
          properties:
            range: { type: object }
            kpis: { type: object }
            myTasks: { type: array, items: { type: object } }
            activity:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/DashboardActivityEntry' }
    AuditActor:
      type: object
      required: [id, name, email, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: [string, 'null'], format: uri }
    AuditLogEntry:
      type: object
      required: [id, action, entityType, entityId, actor, createdAt, before, after, metadata, requestId, ipAddress, userAgent]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        actor:
          oneOf:
            - { $ref: '#/components/schemas/AuditActor' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        before: { description: Snapshot JSON anterior o null }
        after: { description: Snapshot JSON posterior o null }
        metadata: { description: Metadata JSON segura o null }
        requestId: { type: [string, 'null'], format: uuid }
        ipAddress: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
    AuditLogPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEntry' }
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, 'null'], pattern: '^[0-9]+$' }
  responses:
    Problem: { description: Error RFC 7807, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
